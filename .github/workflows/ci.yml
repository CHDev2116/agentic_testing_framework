name: CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_reports:
        description: "Run report-generation job"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests app.py test_connection.py

      - name: Type check (mypy)
        run: |
          mypy --explicit-package-bases src
          MYPYPATH=src mypy --explicit-package-bases app.py test_connection.py

      - name: Unit tests with coverage
        run: |
          PYTHONPATH=src pytest

      - name: Oracle historical regression
        id: oracle_regression
        run: |
          PYTHONPATH=src pytest tests/test_oracle_regression.py -q

      - name: Oracle semantic changelog (job summary)
        if: always()
        env:
          CI_ORACLE_SNAPSHOT_ENFORCE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash scripts/ci_oracle_semantic_summary.sh

      - name: Coverage baseline gate (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_coverage_baseline.py --coverage-xml coverage.xml --baseline-file .ci/coverage_baseline.txt

      - name: Replay smoke (deterministic)
        run: bash scripts/ci_replay_smoke.sh

      - name: Agent smoke (simulated) + KPI gate
        run: |
          PYTHONPATH=src python src/ai_quality_agent.py --profile dev \
            --inference-backend simulated \
            --loopback-planner simulated \
            --planner-skip-health-check
          python scripts/check_quality_kpis.py --enforce \
            --thresholds-file .ci/quality_kpi_thresholds.json

      - name: Repeatability KPI smoke
        run: |
          PYTHONPATH=src python src/ai_quality_agent.py --repeatability-test dev \
            --repeatability-runs 3 \
            --inference-backend simulated \
            --loopback-planner simulated \
            --planner-skip-health-check
          python scripts/check_quality_kpis.py --enforce \
            --thresholds-file .ci/quality_kpi_thresholds.json

  generate-reports:
    runs-on: ubuntu-latest
    needs: [lint-type-test]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_reports == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate reports
        run: |
          PYTHONPATH=src python src/ai_quality_agent.py --profile dev --performance-analysis --overhead-analysis

      - name: Upload coverage + generated reports
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            coverage.xml
            results/
