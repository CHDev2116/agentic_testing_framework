[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_testing_framework"
version = "0.1.0"
description = "Configuration-driven image QA with release gating (GO / REVIEW / NO_GO) and multi-backend inference."
readme = "README.md"
requires-python = ">=3.9"
# Single source of dependency pins for this repo (see CONTRIBUTING.md).
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "beautifulsoup4==4.14.3",
    "black==26.3.1",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.3.2",
    "chromadb",
    "contourpy==1.3.3",
    "curl_cffi==0.13.0",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "frozendict==2.4.7",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "joblib==1.5.3",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "kiwisolver==1.5.0",
    "langchain-core==1.2.25",
    "langchain-ollama==1.0.1",
    "langsmith==0.7.24",
    "matplotlib==3.10.8",
    "multitasking==0.0.12",
    "mypy_extensions==1.1.0",
    "numpy==2.4.4",
    "ollama==0.6.1",
    "opencv-python-headless==4.13.0.92",
    "orjson==3.11.8",
    "packaging==26.0",
    "pandas==3.0.2",
    "pathspec==1.0.4",
    "peewee==4.0.4",
    "pillow==12.2.0",
    "platformdirs==4.9.4",
    "protobuf==7.34.1",
    "psutil==7.2.2",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytokens==0.4.1",
    "pytz==2026.1.post1",
    "PyYAML==6.0.3",
    "requests==2.33.1",
    "requests-toolbelt==1.0.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "sentence-transformers",
    "six==1.17.0",
    "soupsieve==2.8.3",
    "streamlit==1.57.0",
    "tenacity==9.1.4",
    "threadpoolctl==3.6.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "urllib3==2.6.3",
    "uuid_utils==0.14.1",
    "websockets==16.0",
    "xxhash==3.6.0",
    "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.15.12",
    "mypy",
]

[tool.setuptools]
py-modules = [
    "ai_quality_agent",
    "mock_device",
    "verify_capture_success",
    "test_failure_memory_retrieval",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=34"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false
