[project]
name = "agentic_testing_framework"
version = "0.1.0"
description = "Configuration-driven image QA with release gating (GO / REVIEW / NO_GO) and multi-backend inference."
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]